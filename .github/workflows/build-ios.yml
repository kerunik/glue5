name: iOS
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - run: mise run ios:build
      - run: mkdir -p Payload
      - run: find . -name '*.app' -type d | head -1 > app.txt
      - run: cp -r "$(cat app.txt)" Payload/
      - run: zip -r Glue5.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Glue5-iOS
          path: Glue5.ipa
