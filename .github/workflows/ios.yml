name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - run: curl https://mise.run | sh
    run: echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
    run: mise activate bash >> $GITHUB_ENV
    run: mise install
    run: mise run setup
    run: mise run ios:build
      
    run: mkdir -p Payload
    run: cp -r $(find . -name "*.app" -type d | head -1) Payload/
    run: zip -r Glue5.ipa Payload
    
    uses: actions/upload-artifact@v4
    with:
      name: Glue5-iOS
      path: Glue5.ipa
