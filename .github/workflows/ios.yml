name: Build iOS for LiveContainer

on:
  workflow_dispatch: # Запускается вручную по кнопке, чтобы не тратить время при каждом пуше

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        run: |
          curl https://mise.run
 | sh
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          mise activate bash >> $GITHUB_ENV

      - name: Setup and Build iOS
        run: |
          mise install
          mise run setup
          mise run ios:build

      - name: Package into IPA
        run: |
          # Ищем собранный .app бандл (исключая симуляторные версии)
          APP_PATH=$(find . -name "*.app" -type d | grep -v "Simulator" | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r Glue5_LiveContainer.ipa Payload
            echo "IPA created successfully!"
          else
            echo "Error: Could not find .app file"
            find . -name "*.app" -type d
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glue5-iOS-LiveContainer
          path: Glue5_LiveContainer.ipa
